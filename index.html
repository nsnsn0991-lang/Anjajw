<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria — Game Memori Seru</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --card-back1: #667eea;
    --card-back2: #764ba2;
    --accent: #ffd166;
    --success: #06d6a0;
    --text: #f5f5fa;
    --muted: rgba(245, 245, 250, 0.65);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 200% 200%;
    animation: bgShift 15s ease infinite;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    overflow-x: hidden;
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  header { text-align: center; margin-bottom: 20px; }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    background: linear-gradient(90deg, #ffd166, #ef476f, #06d6a0, #118ab2);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow 6s linear infinite;
    letter-spacing: 2px;
  }

  @keyframes rainbow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .tagline { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }

  .btn {
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(6px);
  }

  .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.16); }

  .btn.active {
    background: var(--accent);
    color: #1a1a2e;
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(255, 209, 102, 0.4);
  }

  .btn.restart {
    background: linear-gradient(135deg, #ef476f, #b5179e);
    border: none;
    box-shadow: 0 4px 20px rgba(239, 71, 111, 0.35);
  }

  .stats {
    display: flex;
    gap: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 10px 22px;
    text-align: center;
    min-width: 100px;
    backdrop-filter: blur(6px);
  }

  .stat .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
  }

  .stat .value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .board {
    display: grid;
    gap: 12px;
    perspective: 1000px;
    width: min(92vw, 560px);
  }

  .board.easy   { grid-template-columns: repeat(4, 1fr); }
  .board.medium { grid-template-columns: repeat(4, 1fr); }
  .board.hard   { grid-template-columns: repeat(6, 1fr); width: min(94vw, 680px); }

  .card {
    aspect-ratio: 1;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
  }

  .card.flipped { transform: rotateY(180deg); }

  .card.matched { cursor: default; animation: pop 0.5s ease; }

  @keyframes pop {
    0%   { transform: rotateY(180deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    user-select: none;
  }

  .card-front {
    background: linear-gradient(135deg, var(--card-back1), var(--card-back2));
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    border: 2px solid rgba(255, 255, 255, 0.15);
  }

  .card-front::after {
    content: '✦';
    color: rgba(255, 255, 255, 0.55);
    font-size: clamp(1.2rem, 4vw, 1.8rem);
  }

  .card:not(.flipped):hover .card-front {
    box-shadow: 0 10px 26px rgba(102, 126, 234, 0.55);
    border-color: rgba(255, 255, 255, 0.4);
  }

  .card-back {
    background: rgba(255, 255, 255, 0.95);
    transform: rotateY(180deg);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
  }

  .card.matched .card-back {
    background: linear-gradient(135deg, #d8fff3, #a7f3d0);
    box-shadow: 0 0 22px rgba(6, 214, 160, 0.6);
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 8, 30, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 50;
    backdrop-filter: blur(8px);
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .modal {
    background: linear-gradient(160deg, #1e1b4b, #312e81);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 40px 48px;
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    max-width: 90vw;
  }

  .overlay.show .modal { transform: scale(1); }

  .modal .trophy { font-size: 4rem; animation: bounce 1s ease infinite; display: inline-block; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  .modal h2 { font-size: 2rem; margin: 12px 0 6px; color: var(--accent); }
  .modal p { color: var(--muted); margin-bottom: 8px; line-height: 1.6; }
  .modal .highlight { color: var(--success); font-weight: 700; }
  .modal .btn { margin-top: 18px; }

  .confetti {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 12px;
    z-index: 60;
    pointer-events: none;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.6; }
  }

  footer { margin-top: 28px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>🧠 MEMORIA</h1>
    <p class="tagline">Temukan semua pasangan kartu secepat mungkin!</p>
  </header>

  <div class="controls">
    <button class="btn active" data-level="easy">😊 Mudah (4×4)</button>
    <button class="btn" data-level="medium">🤔 Sedang (4×5)</button>
    <button class="btn" data-level="hard">🔥 Sulit (6×6)</button>
    <button class="btn restart" id="restartBtn">🔄 Ulangi</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Waktu</div><div class="value" id="timer">0:00</div></div>
    <div class="stat"><div class="label">Langkah</div><div class="value" id="moves">0</div></div>
    <div class="stat"><div class="label">Pasangan</div><div class="value" id="pairs">0/8</div></div>
    <div class="stat"><div class="label">Rekor</div><div class="value" id="best">—</div></div>
  </div>

  <div class="board easy" id="board"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <span class="trophy">🏆</span>
      <h2>Selamat, Kamu Menang!</h2>
      <p id="resultText"></p>
      <p id="recordText"></p>
      <button class="btn restart" id="playAgainBtn">🎮 Main Lagi</button>
    </div>
  </div>

  <footer>Dibuat dengan ❤️ — klik kartu untuk membaliknya, cocokkan emoji yang sama!</footer>

<script>
(function () {
  const EMOJIS = ['🐶','🐱','🦊','🐼','🐨','🦁','🐸','🐵','🦄','🐙','🦋','🐢','🍕','🍩','🍉','🌈','⚽','🎸'];
  const LEVELS = { easy: 8, medium: 10, hard: 18 };

  const board = document.getElementById('board');
  const timerEl = document.getElementById('timer');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const resultText = document.getElementById('resultText');
  const recordText = document.getElementById('recordText');

  let level = 'easy';
  let firstCard = null;
  let lock = false;
  let moves = 0;
  let matched = 0;
  let seconds = 0;
  let timerId = null;
  let started = false;

  function formatTime(s) {
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function getBest() {
    const v = localStorage.getItem('memoria-best-' + level);
    return v ? JSON.parse(v) : null;
  }

  function showBest() {
    const b = getBest();
    bestEl.textContent = b ? formatTime(b.time) : '—';
  }

  function startTimer() {
    if (timerId) return;
    timerId = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function newGame() {
    stopTimer();
    firstCard = null;
    lock = false;
    moves = 0;
    matched = 0;
    seconds = 0;
    started = false;
    timerEl.textContent = '0:00';
    movesEl.textContent = '0';
    overlay.classList.remove('show');

    const pairCount = LEVELS[level];
    pairsEl.textContent = '0/' + pairCount;
    showBest();

    const deck = shuffle(
      shuffle(EMOJIS.slice()).slice(0, pairCount).flatMap(e => [e, e])
    );

    board.className = 'board ' + level;
    board.innerHTML = '';
    deck.forEach(emoji => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.innerHTML =
        '<div class="card-face card-front"></div>' +
        '<div class="card-face card-back">' + emoji + '</div>';
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (lock || card.classList.contains('flipped')) return;

    if (!started) { started = true; startTimer(); }

    card.classList.add('flipped');

    if (!firstCard) {
      firstCard = card;
      return;
    }

    moves++;
    movesEl.textContent = moves;

    if (firstCard.dataset.emoji === card.dataset.emoji) {
      firstCard.classList.add('matched');
      card.classList.add('matched');
      firstCard = null;
      matched++;
      pairsEl.textContent = matched + '/' + LEVELS[level];
      if (matched === LEVELS[level]) win();
    } else {
      lock = true;
      const a = firstCard;
      firstCard = null;
      setTimeout(() => {
        a.classList.remove('flipped');
        card.classList.remove('flipped');
        lock = false;
      }, 800);
    }
  }

  function win() {
    stopTimer();
    resultText.innerHTML =
      'Kamu menyelesaikannya dalam <span class="highlight">' + formatTime(seconds) +
      '</span> dengan <span class="highlight">' + moves + ' langkah</span>.';

    const best = getBest();
    if (!best || seconds < best.time) {
      localStorage.setItem('memoria-best-' + level, JSON.stringify({ time: seconds, moves }));
      recordText.textContent = '🎉 Rekor baru untuk level ini!';
    } else {
      recordText.textContent = 'Rekor terbaikmu: ' + formatTime(best.time) + ' (' + best.moves + ' langkah)';
    }
    showBest();

    setTimeout(() => overlay.classList.add('show'), 500);
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#ffd166', '#ef476f', '#06d6a0', '#118ab2', '#b5179e', '#f77f00'];
    for (let i = 0; i < 120; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        c.style.width = c.style.height = 6 + Math.random() * 10 + 'px';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5500);
      }, i * 25);
    }
  }

  document.querySelectorAll('[data-level]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-level]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      level = btn.dataset.level;
      newGame();
    });
  });

  document.getElementById('restartBtn').addEventListener('click', newGame);
  document.getElementById('playAgainBtn').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
